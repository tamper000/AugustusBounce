name: Build

on:
  # release build: git tag v0.1.0 && git push origin v0.1.0
  push:
    tags: ['v*']
  # everything else: Actions -> Build -> Run workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: echo "value=$(grep -oP '^mod_version=\K.*' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt

      - name: Collect jar
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR=$(find build/libs -maxdepth 1 -name 'augustusbounce-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          test -n "$JAR" || { echo "no mod jar in build/libs" >&2; exit 1; }
          cp "$JAR" "dist/AugustusBounce-${{ steps.version.outputs.value }}-${GITHUB_SHA::7}.jar"

      - uses: actions/upload-artifact@v7
        with:
          name: AugustusBounce-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error

      # Tag push (v0.1.0) -> permanent versioned release
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "AugustusBounce ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.jar --clobber

      # Manual run on main -> refresh the rolling "latest" release
      - name: Update latest release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp dist/*.jar dist/AugustusBounce-latest.jar
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest build" --prerelease \
              --notes "Rolling build of the main branch. Commit: $GITHUB_SHA"
          fi
          gh release upload latest dist/AugustusBounce-latest.jar --clobber
